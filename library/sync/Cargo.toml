[package]
name = "libakarin-sync"
version = "0.1.0"
edition = "2024"

[lib]
# Several documentation examples depend on host-side GC runtime setup or
# describe private helper types. Keep them as narrative docs and validate this
# crate through its unit/integration suites instead.
doctest = false

[features]
default = []
host-thread-local-gc = []

[dependencies]
libakarin-machine-core = { path = "../machine" }
libakarin-collections = { path = "../collections" }
thiserror = { version = "2.0.18", default-features = false }
hashbrown = "0.16.1"
crossbeam-utils = { version = "0.8.21", default-features = false }
arc-swap = { version = "1.7.1", features = ["experimental-thread-local"] }
rpds = { version = "1.1.1", default-features = false }
crossbeam-queue = { version = "0.3.12", default-features = false, features = ["alloc"] }
atomig = "0.4.3"

[dev-dependencies]
lazy_static = "1.5.0"
crossbeam-utils = { version = "0.8.21", features = ["std"] }
criterion = "0.7.0"
crossbeam-epoch = "0.9.8"
crossbeam-skiplist = "0.1.3"
haphazard = "0.1.8"
rand = "0.9.1"
tikv-jemallocator = "0.6.1"

[[bench]]
name = "gc_stack"
harness = false

[[bench]]
name = "gc_single_thread"
harness = false

[[bench]]
name = "gc_maps"
harness = false
